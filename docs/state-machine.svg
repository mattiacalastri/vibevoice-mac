<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fff52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="330" rx="16" fill="#0a0e0a"/>
  <text x="32" y="42" fill="#1fff52" font-size="20" font-weight="bold">VibeVoice — engine state machine</text>
  <text x="32" y="66" fill="#5a7a5f" font-size="13">The value in ~/.vibevoice/state on each transition. Push-to-talk drives it.</text>

  <!-- idle -->
  <rect x="40" y="150" width="190" height="72" rx="36" fill="#0d130d" stroke="#5a7a5f" stroke-width="1.8"/>
  <text x="135" y="183" fill="#cfeccf" font-size="18" font-weight="bold" text-anchor="middle">idle</text>
  <text x="135" y="204" fill="#5a7a5f" font-size="11" text-anchor="middle">mic paused · chip folded</text>

  <!-- recording -->
  <rect x="295" y="150" width="190" height="72" rx="36" fill="#0f1a10" stroke="#1fff52" stroke-width="1.8"/>
  <text x="390" y="183" fill="#1fff52" font-size="18" font-weight="bold" text-anchor="middle">recording</text>
  <text x="390" y="204" fill="#9fd3a4" font-size="11" text-anchor="middle">red dot · live text</text>

  <!-- transcribing -->
  <rect x="550" y="150" width="190" height="72" rx="36" fill="#0f1a10" stroke="#1fff52" stroke-width="1.8"/>
  <text x="645" y="183" fill="#1fff52" font-size="18" font-weight="bold" text-anchor="middle">transcribing</text>
  <text x="645" y="204" fill="#9fd3a4" font-size="11" text-anchor="middle">amber dot · final pass</text>

  <!-- idle -> recording -->
  <line x1="232" y1="186" x2="291" y2="186" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="120" fill="#1fff52" font-size="12" text-anchor="middle">⌃ held</text>
  <text x="262" y="137" fill="#5a7a5f" font-size="10" text-anchor="middle">ptt file appears</text>

  <!-- recording -> transcribing -->
  <line x1="487" y1="186" x2="546" y2="186" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="517" y="120" fill="#1fff52" font-size="12" text-anchor="middle">⌃ released</text>
  <text x="517" y="137" fill="#5a7a5f" font-size="10" text-anchor="middle">ptt file gone</text>

  <!-- transcribing -> idle -->
  <polyline points="645,224 645,262 135,262 135,228" fill="none" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="282" fill="#1fff52" font-size="12" text-anchor="middle">text typed → green dot → back to idle</text>

  <text x="390" y="312" fill="#5a7a5f" font-size="11" text-anchor="middle">Hands-free (VIBEVOICE_PTT=0): Silero VAD opens on speech and closes after 0.8 s of silence.</text>
</svg>
