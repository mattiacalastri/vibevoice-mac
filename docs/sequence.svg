<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fff52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="300" rx="16" fill="#0a0e0a"/>
  <text x="32" y="42" fill="#1fff52" font-size="20" font-weight="bold">VibeVoice — one dictation, end to end</text>
  <text x="32" y="66" fill="#5a7a5f" font-size="13">Hold Control, talk, let go. The text lands where the cursor is.</text>

  <line x1="60" y1="140" x2="800" y2="140" stroke="#1f2b20" stroke-width="2"/>

  <!-- 7 steps, 120 px apart -->
  <g font-size="13" font-weight="bold" fill="#cfeccf" text-anchor="middle">
    <text x="70" y="114">1 · hold ⌃</text>
    <text x="190" y="114">2 · record</text>
    <text x="310" y="114">3 · live text</text>
    <text x="430" y="114">4 · type</text>
    <text x="550" y="114">5 · let go</text>
    <text x="670" y="114">6 · finish</text>
    <text x="790" y="114">7 · ↵</text>
  </g>

  <g stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)">
    <line x1="82" y1="140" x2="174" y2="140"/>
    <line x1="202" y1="140" x2="294" y2="140"/>
    <line x1="322" y1="140" x2="414" y2="140"/>
    <line x1="442" y1="140" x2="534" y2="140"/>
    <line x1="562" y1="140" x2="654" y2="140"/>
    <line x1="682" y1="140" x2="774" y2="140"/>
  </g>
  <g fill="#1fff52">
    <circle cx="70" cy="140" r="10"/>
    <circle cx="190" cy="140" r="10"/>
    <circle cx="310" cy="140" r="10"/>
    <circle cx="430" cy="140" r="10"/>
    <circle cx="550" cy="140" r="10"/>
    <circle cx="670" cy="140" r="10"/>
  </g>
  <circle cx="790" cy="140" r="10" fill="none" stroke="#1fff52" stroke-width="2"/>

  <g font-size="11" fill="#7d9b81" text-anchor="middle">
    <text x="70" y="172">chip opens</text>
    <text x="70" y="187">glow runs out</text>
    <text x="190" y="172">mic resumes</text>
    <text x="190" y="187">in ~60 ms</text>
    <text x="310" y="172">re-decoded</text>
    <text x="310" y="187">in the notch</text>
    <text x="430" y="172">agreed words</text>
    <text x="430" y="187">typed as keys</text>
    <text x="550" y="172">one press =</text>
    <text x="550" y="187">one message</text>
    <text x="670" y="172">last words</text>
    <text x="670" y="187">pasted · dot green</text>
    <text x="790" y="172">optional</text>
    <text x="790" y="187">Return</text>
  </g>

  <rect x="230" y="222" width="400" height="50" rx="12" fill="#0f1a10" stroke="#1fff52" stroke-width="1.2"/>
  <text x="430" y="243" fill="#1fff52" font-size="13" font-weight="bold" text-anchor="middle">🔒 100% local</text>
  <text x="430" y="261" fill="#9fd3a4" font-size="11" text-anchor="middle">whisper runs on-device — no audio leaves the Mac</text>
</svg>
