<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fff52"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ffa82e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="470" rx="16" fill="#0a0e0a"/>
  <text x="32" y="42" fill="#1fff52" font-size="20" font-weight="bold">VibeVoice — system data flow</text>
  <text x="32" y="66" fill="#5a7a5f" font-size="13">Three decoupled processes. They share no imports — only files under ~/.vibevoice/</text>

  <!-- mic -->
  <text x="112" y="112" fill="#cfeccf" font-size="26" text-anchor="middle">🎤</text>
  <text x="112" y="132" fill="#5a7a5f" font-size="11" text-anchor="middle">microphone</text>
  <line x1="112" y1="140" x2="112" y2="166" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- engine.py -->
  <rect x="22" y="170" width="180" height="140" rx="12" fill="#0f1a10" stroke="#1fff52" stroke-width="1.5"/>
  <text x="112" y="200" fill="#1fff52" font-size="16" font-weight="bold" text-anchor="middle">engine.py</text>
  <text x="112" y="224" fill="#9fd3a4" font-size="11" text-anchor="middle">capture · Silero VAD</text>
  <text x="112" y="242" fill="#9fd3a4" font-size="11" text-anchor="middle">whisper-turbo (MLX)</text>
  <text x="112" y="260" fill="#9fd3a4" font-size="11" text-anchor="middle">live partials</text>
  <text x="112" y="278" fill="#9fd3a4" font-size="11" text-anchor="middle">types at the cursor</text>
  <text x="112" y="298" fill="#5a7a5f" font-size="10" text-anchor="middle">writes the state files</text>

  <!-- state dir -->
  <rect x="290" y="150" width="200" height="200" rx="12" fill="#0d130d" stroke="#5a7a5f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="174" fill="#cfeccf" font-size="13" font-weight="bold" text-anchor="middle">~/.vibevoice/</text>
  <rect x="306" y="184" width="168" height="22" rx="6" fill="#101a11"/>
  <text x="390" y="199" fill="#1fff52" font-size="12" text-anchor="middle">state</text>
  <rect x="306" y="210" width="168" height="22" rx="6" fill="#101a11"/>
  <text x="390" y="225" fill="#1fff52" font-size="12" text-anchor="middle">levels.bin · 60×f32</text>
  <rect x="306" y="236" width="168" height="22" rx="6" fill="#101a11"/>
  <text x="390" y="251" fill="#1fff52" font-size="12" text-anchor="middle">partial.txt</text>
  <rect x="306" y="262" width="168" height="22" rx="6" fill="#101a11"/>
  <text x="390" y="277" fill="#1fff52" font-size="12" text-anchor="middle">raw.txt · paste.json</text>
  <rect x="306" y="296" width="168" height="40" rx="6" fill="#1a1408" stroke="#ffa82e" stroke-width="1"/>
  <text x="390" y="313" fill="#ffa82e" font-size="12" text-anchor="middle">ptt</text>
  <text x="390" y="328" fill="#a88a5a" font-size="10" text-anchor="middle">exists while ⌃ is held</text>

  <!-- pill -->
  <rect x="578" y="170" width="180" height="140" rx="12" fill="#0f1a10" stroke="#1fff52" stroke-width="1.5"/>
  <text x="668" y="200" fill="#1fff52" font-size="16" font-weight="bold" text-anchor="middle">vibevoice.py</text>
  <text x="668" y="224" fill="#9fd3a4" font-size="11" text-anchor="middle">notch chip · live text</text>
  <text x="668" y="242" fill="#9fd3a4" font-size="11" text-anchor="middle">edge glow</text>
  <text x="668" y="260" fill="#9fd3a4" font-size="11" text-anchor="middle">menu-bar menu</text>
  <text x="668" y="278" fill="#9fd3a4" font-size="11" text-anchor="middle">watches ⌃ Control</text>
  <text x="668" y="298" fill="#5a7a5f" font-size="10" text-anchor="middle">reads state · writes ptt</text>

  <!-- Control key -->
  <rect x="644" y="96" width="48" height="40" rx="8" fill="#141a14" stroke="#cfeccf" stroke-width="1.2"/>
  <text x="668" y="122" fill="#cfeccf" font-size="16" text-anchor="middle">⌃</text>
  <text x="712" y="121" fill="#5a7a5f" font-size="11">hold</text>
  <line x1="668" y1="138" x2="668" y2="166" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- engine -> files (writes) -->
  <line x1="202" y1="232" x2="288" y2="232" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="223" fill="#1fff52" font-size="11" text-anchor="middle">writes</text>

  <!-- files -> pill (reads) -->
  <line x1="492" y1="232" x2="576" y2="232" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="534" y="223" fill="#1fff52" font-size="11" text-anchor="middle">reads</text>

  <!-- pill -> ptt -> engine -->
  <polyline points="668,310 668,316 534,316" fill="none" stroke="#ffa82e" stroke-width="1.6"/>
  <line x1="534" y1="316" x2="478" y2="316" stroke="#ffa82e" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <line x1="304" y1="316" x2="206" y2="290" stroke="#ffa82e" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <text x="232" y="346" fill="#a88a5a" font-size="10" text-anchor="middle">engine records</text>
  <text x="232" y="359" fill="#a88a5a" font-size="10" text-anchor="middle">while it exists</text>

  <!-- engine -> frontmost app -->
  <line x1="112" y1="310" x2="112" y2="380" stroke="#1fff52" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="22" y="384" width="250" height="56" rx="10" fill="#0f1a10" stroke="#1fff52" stroke-width="1.2"/>
  <text x="147" y="406" fill="#cfeccf" font-size="12" text-anchor="middle">→ the frontmost app</text>
  <text x="147" y="425" fill="#5a7a5f" font-size="10" text-anchor="middle">keystrokes as you speak · ⌘V the tail</text>

  <!-- notch -->
  <text x="668" y="340" fill="#cfeccf" font-size="12" text-anchor="middle">▲ draws in the notch</text>
  <text x="668" y="356" fill="#5a7a5f" font-size="10" text-anchor="middle">and round the screen edge</text>

  <!-- autosend -->
  <rect x="300" y="384" width="458" height="56" rx="10" fill="#0d130d" stroke="#5a7a5f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="529" y="406" fill="#cfeccf" font-size="12" text-anchor="middle">autosend.py  (optional, standalone)</text>
  <text x="529" y="425" fill="#5a7a5f" font-size="10" text-anchor="middle">presses Return once typing settles · window-locked</text>
</svg>
